# The checks the Makefile runs, run on every change.
#
# The companion of the visual-telemetry server plugin: the client half. Tested
# against a fake of its one route, from its README; the app is not needed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: go test (${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "stable"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Build and vet
        run: |
          make build
          make vet

      - name: Test
        run: make test

      - name: Coverage
        run: make cover

      # Once each. Not a measurement — a benchmark that no longer compiles is
      # one nobody finds until they need it.
      - name: Benchmarks still run
        run: make bench-smoke

  lint:
    name: golangci-lint, gofumpt, tidy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2 # matches the local toolchain; Renovate bumps it

      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@v0.12.0
          test -z "$(gofumpt -l .)" || { gofumpt -l .; exit 1; }

      # -diff fails rather than rewriting, so the module graph a tag builds from
      # is the one that was reviewed.
      - name: go mod tidy is a no-op
        run: go mod tidy -diff

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
